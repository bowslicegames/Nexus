[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-cognitive"
version = "0.1.0"
description = "An experimental, continually extensible cognitive architecture."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
nexus = "nexus.cli:main"
nexus-web = "nexus.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus = ["index.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
